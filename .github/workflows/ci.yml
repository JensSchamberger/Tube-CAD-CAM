name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      # Windows-only WPF smoke test (real window, binding-error detection)
      - run: dotnet test tests/TubeCadCam.Host.Wpf.Tests -c Release
